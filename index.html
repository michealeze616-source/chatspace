<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatSpace</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
  html, body { height: 100%; }
  body { background: #ECE5DD; display: flex; align-items: center; justify-content: center; }
  #app { width: 100%; max-width: 480px; height: 100vh; max-height: 800px; background: #fff; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.2); position: relative; overflow: hidden; }

  /* Login */
  #login-screen { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px; background: linear-gradient(135deg, #25D366, #128C7E); color:#fff; text-align:center; }
  #login-screen h1 { font-size:1.8rem; margin-bottom:8px; }
  #login-screen p { margin-bottom:24px; opacity:0.9; }
  #username-input, #newchat-input { width:100%; padding:14px; border-radius:10px; border:none; font-size:1rem; margin-bottom:14px; text-align:center; }
  #join-btn, #newchat-confirm { width:100%; padding:14px; border-radius:10px; border:none; background:#fff; color:#128C7E; font-size:1rem; font-weight:bold; cursor:pointer; }
  #join-btn:hover, #newchat-confirm:hover { background:#f0f0f0; }

  /* Chat list */
  #list-screen { display:none; flex-direction:column; height:100%; }
  #list-header { background:#128C7E; color:#fff; padding:16px; display:flex; align-items:center; justify-content:space-between; }
  #list-header h2 { font-size:1.2rem; }
  #new-chat-btn { background:#25D366; color:#fff; border:none; border-radius:50%; width:40px; height:40px; font-size:1.3rem; cursor:pointer; }
  #chat-list { flex:1; overflow-y:auto; }
  .chat-item { display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid #eee; cursor:pointer; }
  .chat-item:hover { background:#f7f7f7; }
  .chat-item .avatar { width:44px; height:44px; border-radius:50%; background:#25D366; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:bold; flex-shrink:0; }
  .chat-item .info { flex:1; overflow:hidden; }
  .chat-item .info h3 { font-size:1rem; color:#222; }
  .chat-item .info p { font-size:0.85rem; color:#888; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #empty-list { padding:40px 20px; text-align:center; color:#999; }

  /* New chat overlay */
  #newchat-overlay { display:none; position:absolute; inset:0; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index:10; }
  #newchat-box { background:#fff; border-radius:14px; padding:24px; width:85%; }
  #newchat-box h3 { margin-bottom:14px; color:#333; }
  #newchat-cancel { width:100%; padding:12px; border:none; border-radius:10px; background:#eee; color:#555; margin-top:8px; cursor:pointer; }

  /* Chat screen */
  #chat-screen { display:none; flex-direction:column; height:100%; }
  #chat-header { background:#128C7E; color:#fff; padding:16px; display:flex; align-items:center; gap:10px; }
  #back-btn { background:none; border:none; color:#fff; font-size:1.3rem; cursor:pointer; padding-right:4px; }
  #chat-header .avatar { width:38px; height:38px; border-radius:50%; background:#25D366; display:flex; align-items:center; justify-content:center; font-weight:bold; }
  #chat-header .info h2 { font-size:1rem; }
  #chat-header .info span { font-size:0.75rem; opacity:0.85; }

  #messages { flex:1; overflow-y:auto; padding:16px; background:#ECE5DD; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:75%; padding:10px 14px; border-radius:14px; font-size:0.95rem; line-height:1.3; }
  .msg .time { display:block; font-size:0.65rem; opacity:0.6; margin-top:4px; text-align:right; }
  .msg.sent { align-self:flex-end; background:#DCF8C6; border-bottom-right-radius:4px; }
  .msg.received { align-self:flex-start; background:#fff; border-bottom-left-radius:4px; }

  #input-bar { display:flex; padding:10px; gap:8px; background:#f0f0f0; border-top:1px solid #ddd; }
  #message-input { flex:1; padding:12px 16px; border-radius:20px; border:1px solid #ccc; font-size:0.95rem; outline:none; }
  #send-btn { width:46px; height:46px; border-radius:50%; border:none; background:#25D366; color:#fff; font-size:1.2rem; cursor:pointer; flex-shrink:0; }
</style>
</head>
<body>

<div id="app">

  <div id="login-screen">
    <h1>💬 ChatSpace</h1>
    <p>Enter a username to start chatting</p>
    <input type="text" id="username-input" placeholder="Your name" maxlength="20">
    <button id="join-btn">Join Chat</button>
  </div>

  <div id="list-screen">
    <div id="list-header">
      <h2 id="my-name-label">Chats</h2>
      <button id="new-chat-btn">+</button>
    </div>
    <div id="chat-list"></div>
  </div>

  <div id="newchat-overlay">
    <div id="newchat-box">
      <h3>Start a chat</h3>
      <input type="text" id="newchat-input" placeholder="Enter their username">
      <button id="newchat-confirm">Open Chat</button>
      <button id="newchat-cancel">Cancel</button>
    </div>
  </div>

  <div id="chat-screen">
    <div id="chat-header">
      <button id="back-btn">←</button>
      <div class="avatar" id="header-avatar">?</div>
      <div class="info">
        <h2 id="chat-with-name"></h2>
        <span>Firebase live chat</span>
      </div>
    </div>
    <div id="messages"></div>
    <div id="input-bar">
      <input type="text" id="message-input" placeholder="Type a message...">
      <button id="send-btn">➤</button>
    </div>
  </div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDpDyexXZToKCAP0JaBDHYi3-Knrd3EAuQ",
  authDomain: "my-chat-app-58512.firebaseapp.com",
  projectId: "my-chat-app-58512",
  storageBucket: "my-chat-app-58512.firebasestorage.app",
  messagingSenderId: "680917642217",
  appId: "1:680917642217:web:bb339dca19f3f31e147978"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let username = '';
let currentChatWith = '';
let currentChatId = '';
let unsubscribe = null;

const loginScreen = document.getElementById('login-screen');
const listScreen = document.getElementById('list-screen');
const chatScreen = document.getElementById('chat-screen');
const usernameInput = document.getElementById('username-input');
const joinBtn = document.getElementById('join-btn');
const chatListEl = document.getElementById('chat-list');
const newChatBtn = document.getElementById('new-chat-btn');
const newChatOverlay = document.getElementById('newchat-overlay');
const newChatInput = document.getElementById('newchat-input');
const newChatConfirm = document.getElementById('newchat-confirm');
const newChatCancel = document.getElementById('newchat-cancel');
const backBtn = document.getElementById('back-btn');
const messagesEl = document.getElementById('messages');
const messageInput = document.getElementById('message-input');
const sendBtn = document.getElementById('send-btn');
const chatWithName = document.getElementById('chat-with-name');
const headerAvatar = document.getElementById('header-avatar');
const myNameLabel = document.getElementById('my-name-label');

function chatIdFor(a, b) {
  return [a.toLowerCase(), b.toLowerCase()].sort().join('__');
}

function getContacts() {
  return JSON.parse(localStorage.getItem('chat_contacts_' + username) || '[]');
}
function saveContact(name) {
  let contacts = getContacts();
  if (!contacts.includes(name)) {
    contacts.unshift(name);
    localStorage.setItem('chat_contacts_' + username, JSON.stringify(contacts));
  }
}

joinBtn.onclick = joinChat;
usernameInput.addEventListener('keypress', e => { if (e.key === 'Enter') joinChat(); });

function joinChat() {
  const name = usernameInput.value.trim();
  if (!name) return;
  username = name;
  loginScreen.style.display = 'none';
  listScreen.style.display = 'flex';
  myNameLabel.textContent = 'Chats — ' + username;
  renderChatList();
}

function renderChatList() {
  const contacts = getContacts();
  if (contacts.length === 0) {
    chatListEl.innerHTML = '<div id="empty-list">No chats yet. Tap + to start one.</div>';
    return;
  }
  chatListEl.innerHTML = '';
  contacts.forEach(name => {
    const item = document.createElement('div');
    item.className = 'chat-item';
    item.innerHTML = `
      <div class="avatar">${name[0].toUpperCase()}</div>
      <div class="info"><h3>${escapeHtml(name)}</h3><p>Tap to open chat</p></div>
    `;
    item.onclick = () => openChat(name);
    chatListEl.appendChild(item);
  });
}

newChatBtn.onclick = () => { newChatOverlay.style.display = 'flex'; newChatInput.value=''; newChatInput.focus(); };
newChatCancel.onclick = () => { newChatOverlay.style.display = 'none'; };
newChatConfirm.onclick = startNewChat;
newChatInput.addEventListener('keypress', e => { if (e.key === 'Enter') startNewChat(); });

function startNewChat() {
  const other = newChatInput.value.trim();
  if (!other || other.toLowerCase() === username.toLowerCase()) return;
  newChatOverlay.style.display = 'none';
  saveContact(other);
  openChat(other);
}

function openChat(otherUser) {
  currentChatWith = otherUser;
  currentChatId = chatIdFor(username, otherUser);
  listScreen.style.display = 'none';
  chatScreen.style.display = 'flex';
  chatWithName.textContent = otherUser;
  headerAvatar.textContent = otherUser[0].toUpperCase();
  messagesEl.innerHTML = '';

  if (unsubscribe) unsubscribe();
  unsubscribe = db.collection('chats').doc(currentChatId).collection('messages')
    .orderBy('timestamp', 'asc')
    .onSnapshot(snapshot => {
      messagesEl.innerHTML = '';
      snapshot.forEach(doc => {
        const m = doc.data();
        addMessageToDOM(m.sender, m.text, m.sender === username, m.timestamp);
      });
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });
}

backBtn.onclick = () => {
  if (unsubscribe) unsubscribe();
  chatScreen.style.display = 'none';
  listScreen.style.display = 'flex';
  renderChatList();
};

sendBtn.onclick = sendMessage;
messageInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });

function sendMessage() {
  const text = messageInput.value.trim();
  if (!text || !currentChatId) return;
  messageInput.value = '';
  db.collection('chats').doc(currentChatId).collection('messages').add({
    sender: username,
    text: text,
    timestamp: firebase.firestore.FieldValue.serverTimestamp()
  });
}

function addMessageToDOM(sender, text, isSent, timestamp) {
  const msg = document.createElement('div');
  msg.className = 'msg ' + (isSent ? 'sent' : 'received');
  let timeStr = '';
  if (timestamp && timestamp.toDate) {
    timeStr = timestamp.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }
  msg.innerHTML = `${escapeHtml(text)}<span class="time">${timeStr}</span>`;
  messagesEl.appendChild(msg);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>

</body>
</html>
